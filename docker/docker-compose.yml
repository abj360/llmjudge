services:
  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    env_file: ../.env
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../docker/dashboard.Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Reached over the compose network, not from the host.
      LLMJUDGE_API_URL: http://api:8000
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: llmjudge
      POSTGRES_PASSWORD: llmjudge
      POSTGRES_DB: llmjudge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmjudge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

networks:
  default:
    name: llmjudge
