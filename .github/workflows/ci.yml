name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: mypy --strict harness metrics safety jobs api config calibration ci store data

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest tests/integration -q --junitxml=integration-junit.xml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest tests/unit -q --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report-${{ github.run_id }}
          path: junit.xml

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # setup-node resolves this from the repo root, not working-directory.
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run build

  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, test, integration-test, dashboard]
    env:
      LLMJUDGE_API_URL: ${{ secrets.LLMJUDGE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: python ci/merge_gate.py --repo "${{ github.event.repository.name }}"
        if: env.LLMJUDGE_API_URL != ''
      - run: "echo 'merge gate skipped: LLMJUDGE_API_URL not configured'"
        if: env.LLMJUDGE_API_URL == ''
